[package]
name = "herdr-issues"
version = "0.1.0"
edition = "2024"
description = "Read GitHub issues for the active workspace's repo, in a herdr pane"
license = "MIT"
publish = false

[dependencies]
# Blocking HTTP, one request in flight at a time. `gzip` is a default feature and
# is worth 14x on the issue list query, so it stays on deliberately.
ureq = { version = "3.3", default-features = false, features = ["rustls", "gzip", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.30"
crossterm = "0.29"
# SIGHUP: herdr sends it on `pane close`, and the viewer must leave the
# alternate screen and exit 0. The handler thread blocks on the signal pipe, so
# it costs nothing while idle.
signal-hook = "0.4"
# `config.toml`. Parsed as a plain table rather than derived onto a struct, so
# an unknown key can warn and be ignored instead of failing the whole file.
toml = "1"
# The cache. `bundled` compiles SQLite from C, which is exactly why prebuilt
# binaries are not optional (ADR-0001, ADR-0003) — an installing user gets
# neither a C compiler nor a runtime `libsqlite3` requirement from us. Pinned to
# 0.37 because 0.40's build script needs a newer rustc than this toolchain has.
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
# The stub GraphQL server gzips its responses, which is how the tests exercise
# the client's gzip path end to end. Already in the tree via ureq's gzip feature.
flate2 = "1"
# The same SQLite the viewer uses, so a test can open the database the pane
# wrote and assert on the real columns — the access bookkeeping the prune ages
# rows by, and the rows it left behind. Nothing here mocks below the seam: this
# is the file, read with SQL.
rusqlite = { version = "0.37", features = ["bundled"] }
